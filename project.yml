name: LotteryWallet
options:
  bundleIdPrefix: com.wenjinliu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  fileTypes:
    "icon":
      file: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  LotteryWallet:
    type: application
    platform: iOS
    sources:
      - path: LotteryWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.lotterywallet
        # iCloud 备份要的 entitlements。容器标识符和
        # `ICloudBackupService.containerID` 必须一字不差。
        CODE_SIGN_ENTITLEMENTS: LotteryWallet/Resources/LotteryWallet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        # 对外版本号。必须和 App Store Connect 里那条版本记录写的一样，
        # 否则上传的包挂不到那条记录下面。改版本只改这一行；
        # 构建号由 CI 用 run number 覆盖，不写死在这里。
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: LotteryWallet/Resources/Info.plist
      properties:
        CFBundleDisplayName: 对个号
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 用于拍摄纸质彩票并在本机识别号码，照片不会离开设备。
        NSPhotoLibraryUsageDescription: 用于从相册选择彩票照片并在本机识别号码，照片不会离开设备。
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # 让备份文件在「文件」App 里显示成一个有名字的文件夹，
        # 而不是一串容器标识符。没有这一段用户根本找不到自己的备份。
        NSUbiquitousContainers:
          iCloud.com.wenjinliu.lotterywallet:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: 对个号
            NSUbiquitousContainerSupportedFolderLevels: Any

  LotteryWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LotteryWalletTests
    dependencies:
      - target: LotteryWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.lotterywallet.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO

schemes:
  LotteryWallet:
    build:
      targets:
        LotteryWallet: all
        LotteryWalletTests: [test]
    test:
      targets:
        - LotteryWalletTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
