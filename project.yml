name: LotteryWallet
options:
  bundleIdPrefix: com.wenjinliu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  LotteryWallet:
    type: application
    platform: iOS
    sources:
      - path: LotteryWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.lotterywallet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: LotteryWallet/Resources/Info.plist
      properties:
        CFBundleDisplayName: 彩票夹
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 用于拍摄纸质彩票并在本机识别号码，照片不会离开设备。
        NSPhotoLibraryUsageDescription: 用于从相册选择彩票照片并在本机识别号码，照片不会离开设备。
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  LotteryWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LotteryWalletTests
    dependencies:
      - target: LotteryWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.lotterywallet.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO

schemes:
  LotteryWallet:
    build:
      targets:
        LotteryWallet: all
        LotteryWalletTests: [test]
    test:
      targets:
        - LotteryWalletTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
