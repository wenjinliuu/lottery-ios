name: Check TestFlight build availability
on:
  workflow_dispatch:
    inputs:
      build:
        type: string
        required: true
      profiles_only:
        type: boolean
        default: false
permissions: {}
jobs:
  inspect:
    timeout-minutes: 9
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install 'pyjwt[crypto]==2.10.1'
      - name: Read App Store Connect build status
        env:
          CHECK_PROFILES: ${{ inputs.profiles_only }}
          CHECK_BUILD: ${{ inputs.build }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import base64, json, os, plistlib, subprocess, time, urllib.parse, urllib.request
          import jwt

          def get(path, params=None):
              now = int(time.time())
              auth = jwt.encode(
                  {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 300, "aud": "appstoreconnect-v1"},
                  os.environ["ASC_PRIVATE_KEY"], algorithm="ES256",
                  headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
              )
              query = "?" + urllib.parse.urlencode(params) if params else ""
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path + query,
                                           headers={"Authorization": "Bearer " + auth})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)["data"]

          for identifier in ["com.wenjinliu.lotterywallet", "com.wenjinliu.lotterywallet.notificationservice"]:
              bundles = get("/v1/bundleIds", {"filter[identifier]": identifier})
              print("BUNDLE", identifier, bool(bundles), flush=True)
              if not bundles:
                  continue
              root = "/v1/bundleIds/" + bundles[0]["id"]
              caps = get(root + "/bundleIdCapabilities")
              print("CAPS", sorted(c["attributes"]["capabilityType"] for c in caps), flush=True)
              profiles = get(root + "/profiles", {"limit": 200})
              matches = [p for p in profiles if p["attributes"]["profileType"] == "IOS_APP_STORE"]
              print("PROFILE_COUNT", len(matches), flush=True)
              for profile in matches:
                  info = profile["attributes"]
                  encoded = info.get("profileContent")
                  if not encoded:
                      continue
                  xml = subprocess.check_output(["openssl", "cms", "-verify", "-noverify", "-inform", "DER"],
                                                input=base64.b64decode(encoded), stderr=subprocess.DEVNULL)
                  ent = plistlib.loads(xml)["Entitlements"]
                  print("PROFILE", info["profileState"], "group", "group.com.wenjinliu.lotterywallet" in ent.get("com.apple.security.application-groups", []), flush=True)
          PY
