name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "构建号（留空则用 GitHub run number）"
        required: false
        type: string
      marketing_version:
        description: "对外版本号，如 1.2（留空则用 project.yml 里的 MARKETING_VERSION）"
        required: false
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Sync icon source artwork
        run: bash Scripts/sync-app-icon.sh

      - name: Write App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # xcodebuild 只认这个固定目录下的 AuthKey_<KEY_ID>.p8
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Generate project
        run: xcodegen generate
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}

      - name: Resolve version numbers
        id: build
        run: |
          NUMBER="${{ inputs.build_number }}"
          if [ -z "$NUMBER" ]; then NUMBER="${{ github.run_number }}"; fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

          # 对外版本号默认取 project.yml 里的值，只有手动填了才覆盖。
          # 覆盖只影响这一次构建，仓库里的版本号仍以 project.yml 为准。
          VERSION="${{ inputs.marketing_version }}"
          if [ -n "$VERSION" ]; then
            echo "version_flag=MARKETING_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version_flag=" >> "$GITHUB_OUTPUT"
          fi

      # 归档不签名：Xcode 自动签名在归档阶段要的是「开发」描述文件，
      # 而开发描述文件必须绑定已注册设备，CI 上没有设备可绑。
      # 分发签名本来就该在导出阶段做，那一步不需要注册设备。
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LotteryWallet.xcodeproj \
            -scheme LotteryWallet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LotteryWallet.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }} \
            ${{ steps.build.outputs.version_flag }} \
            | xcbeautify --renderer github-actions

      - name: Verify archived App Icon
        run: |
          APP_PATH=$(find build/LotteryWallet.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          find "$APP_PATH" -maxdepth 1 -type f -name 'AppIcon*.png' -print -quit | grep -q .

      - name: Write export options
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict>
          </plist>
          PLIST

      # 这一步创建分发证书和 App Store 描述文件，给归档签名，然后直接上传
      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/LotteryWallet.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | xcbeautify --renderer github-actions

      # iCloud entitlement 的排查线索。
      #
      # **只报告，不决定成败。** ExportOptions 里是 destination=upload，
      # xcodebuild 直接把包传上去、本地不留 build/export，所以这里多半什么都
      # 找不到 —— 上一版为此把整条流水线打挂了，而那时候包其实已经传成功。
      # 真正的判据在 App 里（设置 → iCloud → 管理备份 → 诊断），
      # 那是唯一能看到最终二进制签名结果的地方。
      - name: Inspect iCloud entitlement (informational)
        if: always()
        continue-on-error: true
        run: |
          set +e
          APP=""
          if [ -d build/export ]; then
            APP=$(find build/export -maxdepth 3 -name '*.app' -print -quit)
            if [ -z "$APP" ]; then
              IPA=$(find build/export -maxdepth 2 -name '*.ipa' -print -quit)
              if [ -n "$IPA" ]; then
                rm -rf build/unzipped && mkdir -p build/unzipped
                unzip -q "$IPA" -d build/unzipped
                APP=$(find build/unzipped/Payload -maxdepth 1 -name '*.app' -print -quit)
              fi
            fi
          fi
          if [ -z "$APP" ]; then
            echo "ℹ️ 本地没有导出产物（destination=upload 时属正常），跳过检查。"
            echo "   请在真机上看「设置 → iCloud → 管理备份 → 诊断」那三行。"
            exit 0
          fi
          echo "检查 $APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee build/entitlements.txt
          if grep -q "ubiquity-container-identifiers" build/entitlements.txt; then
            echo "✅ iCloud entitlement 已进入签名后的二进制"
          else
            echo "⚠️ 没在签名结果里看到 ubiquity-container-identifiers，请结合 App 内诊断确认"
          fi

      - name: Upload dSYMs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsyms-${{ steps.build.outputs.number }}
          path: build/LotteryWallet.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Clean up API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
