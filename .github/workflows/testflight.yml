name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank: GitHub run number)"
        type: string
        required: false
      marketing_version:
        description: "Marketing version override (blank: project default)"
        type: string
        required: false
      lookup_only:
        description: "Only verify Apple registration; do not archive or upload"
        type: boolean
        default: false
      dry_run:
        description: "Unsigned archive only; never upload"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: lottery-ios-testflight
  cancel-in-progress: false

jobs:
  release:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/testflight-release.yml@1785ec85efe4d88c1a87b5a9125e5ca5125a10ca
    with:
      workdir: .
      project: LotteryWallet.xcodeproj
      scheme: LotteryWallet
      bundle_id: com.wenjinliu.lotterywallet
      sync_command: bash Scripts/sync-app-icon.sh
      generate_command: xcodegen generate
      build_number: ${{ inputs.build_number || '' }}
      marketing_version: ${{ inputs.marketing_version || '' }}
      lookup_only: ${{ inputs.lookup_only || false }}
      dry_run: ${{ inputs.dry_run || false }}
      artifact_prefix: lottery-ios-
      ci_revision: 1785ec85efe4d88c1a87b5a9125e5ca5125a10ca
      entitlements_path: LotteryWallet/Resources/LotteryWallet.entitlements
      entitlement_mode: icloud-verified
      icloud_container: iCloud.com.wenjinliu.lotterywallet
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
