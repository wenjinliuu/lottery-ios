name: Compare SDKs on one iOS 27 simulator
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compile:
    strategy:
      matrix:
        include:
          - { runner: macos-26, xcode: '26.6', major: '26' }
          - { runner: xcode-27, xcode: '27.2', major: '27' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - run: |
          set -euo pipefail
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/gen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/gen.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/gen.zip" -d "$RUNNER_TEMP"
          bash Scripts/sync-app-icon.sh
          python3 Scripts/write-api-config.py
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          xcodebuild build-for-testing -scheme LotteryWallet -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" || { tail -100 "$RUNNER_TEMP/build.log"; exit 1; }
          cd "$RUNNER_TEMP/dd/Build/Products"
          if [[ "${{ matrix.major }}" == "26" ]]; then
            tar czf "$GITHUB_WORKSPACE/products.tgz" Debug-iphonesimulator/LotteryWallet.app
          else
            tar czf "$GITHUB_WORKSPACE/products.tgz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.major }}
          path: products.tgz
          retention-days: 1
  compare:
    needs: compile
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;print(next(d["udid"] for rt,devs in json.load(sys.stdin)["devices"].items() if rt.endswith("iOS-27-2") for d in devs if d["name"]=="iPhone 18 Pro Max"))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          mkdir products
          tar xzf artifacts/sdk-27/products.tgz -C products
          for sdk in 27 26; do
            if [[ "$sdk" == 26 ]]; then
              mv products/Debug-iphonesimulator/LotteryWallet.app "$RUNNER_TEMP/ios27.app"
              tar xzf artifacts/sdk-26/products.tgz -C products
            fi
            /usr/libexec/PlistBuddy -c 'Print DTSDKName' products/Debug-iphonesimulator/LotteryWallet.app/Info.plist
            xcodebuild test-without-building -xctestrun "$(find products -name '*.xctestrun' | head -1)" -destination "platform=iOS Simulator,id=$udid" -parallel-testing-enabled NO -only-testing:LotteryWalletUITests/TopEdgeComparison/testWalletScrollEdge
            mv Tests/LotteryWalletUITests/edge.png "edge-$sdk.png"
            xcrun simctl uninstall "$udid" com.wenjinliu.lotterywallet
          done
      - uses: actions/upload-artifact@v4
        with:
          name: same-runtime-top-edge
          path: edge-*.png
