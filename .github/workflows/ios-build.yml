name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Liquid Glass 需要 iOS 26 SDK，锁定最新正式版 Xcode
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      # 模拟器机型随 runner 镜像变动，动态挑一台可用的 iPhone，避免写死机型名
      - name: Pick simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];\
c=[x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];\
print(sorted(c)[-1] if c else '')")
          if [ -z "$NAME" ]; then echo '找不到可用的 iPhone 模拟器' >&2; exit 1; fi
          echo "找到模拟器：$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild \
            -project LotteryWallet.xcodeproj \
            -scheme LotteryWallet \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify --renderer github-actions
