name: Save SDK comparison screenshots
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45036513635
          github-token: ${{ github.token }}
          name: same-runtime-top-edge
          path: Tests/SDKComparison
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add Tests/SDKComparison/edge-{26,27}.png
          git commit -m "Save wallet scroll comparison on the iOS 27.2 simulator"
          git push origin HEAD:codex/ios27-edge-comparison
