name: App Icon Preview

on:
  push:
    branches: [main]
    paths:
      - "DesignAssets/AppIcon/*.svg"
      - "LotteryWallet/Resources/AppIcon.icon/**"
      - "project.yml"
      - "Scripts/sync-app-icon.sh"
      - ".github/workflows/icon-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-icon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icon:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/app-icon.yml@1785ec85efe4d88c1a87b5a9125e5ca5125a10ca
    with:
      workdir: .
      project: LotteryWallet.xcodeproj
      scheme: LotteryWallet
      icon_path: LotteryWallet/Resources/AppIcon.icon
      sync_command: bash Scripts/sync-app-icon.sh
      generate_command: xcodegen generate
