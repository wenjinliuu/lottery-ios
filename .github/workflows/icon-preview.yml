name: App Icon

on:
  push:
    branches: [main]
    paths:
      - 'DesignAssets/AppIcon/**'
      - '!DesignAssets/AppIcon/previews/**'
      - 'LotteryWallet/Resources/AppIcon.icon/**'
      - 'Scripts/sync-app-icon.sh'
      - '.ios-ci.yml'
      - '.github/workflows/icon-preview.yml'
  workflow_dispatch:

permissions:
  contents: read    # app_icon.commit_previews 没开，不写仓库

concurrency:
  group: app-icon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icon:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/app-icon.yml@a25455e2343131b2803011477f5c5c324f21bc77
