name: Inspect store photography run
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45157510407
          github-token: ${{ github.token }}
          name: build-test-119
          path: /tmp/evidence
      - name: Collect system screenshot evidence
        run: |
          mkdir -p release-frames
          python3 - <<'PYTHON'
          import pathlib,struct,shutil
          for f in pathlib.Path('/tmp/evidence/Test.xcresult/Data').glob('data.*'):
              with f.open('rb') as h: head=h.read(24)
              if head.startswith(b'\x89PNG') and struct.unpack('>II',head[16:24])==(1320,2868):
                  shutil.copyfile(f,pathlib.Path('release-frames')/(f.name+'.png'))
          PYTHON
          git add release-frames
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Collect simulator evidence for store notification validation'
          git push origin HEAD
