name: Inspect store photography run
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45157510407
          github-token: ${{ github.token }}
          name: build-test-119
          path: /tmp/evidence
      - name: Collect system screenshot evidence
        run: |
          mkdir -p evidence
          python3 - <<'PYTHON'
          import json, pathlib, shutil
          root=pathlib.Path('/tmp/evidence/report/attachments')
          for test in json.loads((root/'manifest.json').read_text()):
              for a in test['attachments']:
                  if '07-notification' in a['suggestedHumanReadableName']:
                      shutil.copyfile(root/a['exportedFileName'],'evidence/verified-notification.png')
          PYTHON
          cp /tmp/evidence/report/attachments/manifest.json evidence/release-manifest.json
          cp /tmp/evidence/report/report.md evidence/release-report.md
          git add evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Collect simulator evidence for store notification validation'
          git push origin HEAD
