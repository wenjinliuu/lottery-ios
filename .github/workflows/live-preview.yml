name: Inspect store photography run
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45157503812
          github-token: ${{ github.token }}
          name: build-test-312
          path: /tmp/evidence
      - name: Collect system screenshot evidence
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import pathlib,struct
          root=pathlib.Path('/tmp/evidence')
          for f in (root/'Test.xcresult/Data').glob('data.*'):
              with f.open('rb') as h: head=h.read(24)
              if head.startswith(b'\x89PNG') and struct.unpack('>II', head[16:24])==(1320,2868):
                  import shutil
                  shutil.copyfile(f, pathlib.Path('evidence')/(f.name+'.png'))
          PY
          git add evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Collect simulator evidence for store notification validation'
          git push origin HEAD
